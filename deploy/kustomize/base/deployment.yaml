apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickportal
  labels:
    app.kubernetes.io/name: quickportal
    app.kubernetes.io/component: portal
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quickportal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quickportal
        app.kubernetes.io/component: portal
    spec:
      # Nothing in the pod talks to the API server.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged ships uid/gid 101 (nginx).
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # The only image this project references, and it is not ours: stock
          # upstream nginx-unprivileged, pinned by tag and digest. Nothing in
          # the app depends on nginx beyond the cache headers, so swapping it
          # is a one-line patch.
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # Unprivileged nginx cannot bind 80; the image defaults to 8080.
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          # Readiness checks the thing that can actually be broken: whether
          # the app ConfigMap projected and index.html is servable.
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Liveness only asks whether nginx itself is still answering.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              # No CPU limit on purpose would be defensible too, but a static
              # file server that needs more than this is misbehaving.
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            # IMPORTANT: not one of these ConfigMap mounts uses subPath.
            # kubelet never updates a subPath mount after the container
            # starts, so a subPath here would freeze the user's config at the
            # value it had when the pod started and silently kill live reload.
            # The symptom is "live reload is broken", with no error anywhere.
            - name: app
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: server-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # The user's config is a separate volume at its own path, not
            # nested inside the app volume, and nginx aliases /config/ onto
            # it. Nesting a mount inside a read-only ConfigMap volume relies
            # on the runtime being able to create the mountpoint inside a
            # read-only bind mount, which is not something to bet an install
            # on.
            - name: user-config
              mountPath: /etc/quickportal
              readOnly: true
            # readOnlyRootFilesystem: true, so everything nginx writes needs
            # an emptyDir. /var/cache/nginx also covers the proxy, fastcgi,
            # uwsgi, scgi and client_body temp paths; the pid file lives in
            # /tmp in this image.
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            # Name resolved by the configMapGenerator below, including its
            # content hash, so an app upgrade changes this name and rolls the
            # pod.
            name: quickportal-app
            defaultMode: 0444
        - name: server-config
          configMap:
            name: quickportal-server-config
            defaultMode: 0444
        - name: user-config
          configMap:
            # The user's own ConfigMap. Deliberately an unhashed, stable name:
            # editing it must NOT roll the pod. kubelet reprojects the change
            # into the volume within about a minute and the page picks it up
            # on its next ETag poll.
            #
            # Do not set immutable: true on it. An immutable ConfigMap cannot
            # change at all, which is the other way to kill live reload.
            name: quickportal-config
            defaultMode: 0444
            optional: false
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
