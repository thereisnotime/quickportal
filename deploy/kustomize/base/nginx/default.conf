# QuickPortal server config.
#
# Mounted over /etc/nginx/conf.d, which replaces the image's packaged
# default.conf. The image's docker-entrypoint.d/10-listen-on-ipv6-only.sh
# compares default.conf against the packaged checksum and exits without
# touching it when it differs, so a read-only mount here is safe.
#
# Everything the portal needs from a web server is in this file: an ETag and
# forced revalidation on the config file (live reload depends on it), cacheable
# static assets, and the strict CSP from the design.
#
# Three files are mounted here and all three are required: this one,
# security-headers.inc (the response headers, including the single CSP) and
# frame-src.inc (the one directive of that CSP a deployment may change).

server {
    # nginx-unprivileged runs as uid 101 and cannot bind a privileged port, so
    # the listener is 8080, not 80. The Service maps 80 -> 8080.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # Who the portal is allowed to frame. One directive, in its own file, read
    # once here at server level so every location below inherits it. See
    # frame-src.inc: it ships as 'none' and widening it is half of enabling
    # embedding, the other half being `embed: true` in your config.
    #
    # It has to be included at server level rather than inside each location:
    # `set` is a rewrite-phase directive, the server-level rewrite phase runs
    # for every request including the ones answered by `return`, and the value
    # is read later by add_header in security-headers.inc.
    include /etc/nginx/conf.d/frame-src.inc;

    # No proxy in front is assumed, so never emit absolute redirects pointing
    # at the pod's own notion of the host.
    absolute_redirect off;

    # ETags are the whole mechanism behind live reload: reload.js polls the
    # config with If-None-Match and a 304 costs almost nothing.
    etag on;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  512;
    gzip_types       text/plain text/css application/javascript text/javascript
                     application/json application/yaml text/yaml image/svg+xml;

    # Request bodies are never expected; keep the limit small.
    client_max_body_size 64k;

    # --- the user's config ------------------------------------------------
    #
    # The app fetches ./config/config.yaml. The file itself lives in a
    # separate ConfigMap the user owns, mounted at /etc/quickportal and
    # exposed here with alias, so the user's volume is never nested inside
    # the app's read-only volume.
    #
    # Cache-Control must force a revalidation on every poll. "no-cache" does
    # exactly that: the response may be stored, but it may not be reused
    # without asking, so each poll is a conditional request answered with 304
    # until the ConfigMap actually changes. "no-store" would also work but
    # would throw away the ETag benefit and re-download the config every 30s.
    # Any max-age > 0 here would break live reload, because the browser would
    # answer the poll from its own cache and never see the new config.
    location ^~ /config/ {
        alias /etc/quickportal/;

        # kubelet updates a projected ConfigMap by swapping the ..data
        # symlink, so nginx must be allowed to follow symlinks (the default)
        # and must not cache open file descriptors across the swap.
        open_file_cache off;

        autoindex off;

        types {
            application/yaml yaml yml;
            application/json json;
        }
        default_type application/yaml;

        # expires off: let nothing but the Cache-Control below be emitted.
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- the app shell ----------------------------------------------------
    #
    # index.html is revalidated on every navigation so an upgraded pod is
    # picked up on the next page load rather than on cache expiry.
    location = / {
        try_files /index.html =404;
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /index.html {
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # .mjs is absent from nginx's packaged mime.types, so the vendored YAML
    # parser would otherwise be served as application/octet-stream, and a
    # browser refuses to execute a module script whose MIME type is not a
    # JavaScript one: the page would die on its first import.
    #
    # A location-scoped types block is the fix. It replaces the type map for
    # this location only, which is safe because this location serves nothing
    # but .mjs. (default_type alone does not do it here, and including
    # mime.types inside a types block is a syntax error, because that file
    # declares a types block of its own.)
    #
    # Regex locations are tried in the order they appear, so this has to stay
    # above the generic asset block below, which also matches .mjs.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # --- static assets ----------------------------------------------------
    #
    # The served tree is flat (a ConfigMap key cannot contain a slash), so the
    # assets are matched by extension rather than by an /assets/ prefix.
    #
    # On the max-age: these URLs are NOT content-addressed. The generated
    # ConfigMap name carries a content hash, which rolls the pod, but
    # /app.js stays /app.js, so a browser holding an immutable year-long copy
    # would keep running the old app after an upgrade while index.html
    # already served the new markup. An hour is the compromise: long enough
    # that normal browsing is served from cache, short enough that an upgrade
    # converges without a hard refresh. The ETag makes the revalidation after
    # that hour a 304.
    location ~* \.(?:css|js|mjs|map|json|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf)$ {
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # --- everything else --------------------------------------------------
    location / {
        try_files $uri =404;
        expires off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Dotfiles are never part of the app bundle.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- probes -----------------------------------------------------------
    # Liveness uses this: it answers from nginx itself, with no dependency on
    # any mounted volume, so it reports exactly "the server is running".
    # Readiness instead probes /index.html, because a pod whose app ConfigMap
    # failed to project has nothing to serve and should not take traffic.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
}
