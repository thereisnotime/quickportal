apiVersion: v1
kind: Service
metadata:
  name: quickportal
  labels:
    app.kubernetes.io/name: quickportal
    app.kubernetes.io/component: portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quickportal
  ports:
    - name: http
      port: 80
      # nginx-unprivileged listens on 8080, not 80.
      targetPort: http
      protocol: TCP
