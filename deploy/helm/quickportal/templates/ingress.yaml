{{- if .Values.ingress.enabled }}
{{/*
The portal has no authentication of its own, by design: it is a static page.
Anything beyond a trusted network should have an auth proxy in front of it,
configured here through ingress.annotations.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quickportal.fullname" . }}
  labels:
    {{- include "quickportal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "quickportal.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
