apiVersion: v1
kind: Service
metadata:
  name: {{ include "quickportal.fullname" . }}
  labels:
    {{- include "quickportal.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quickportal.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # The container listens on 8080: unprivileged nginx cannot bind 80.
      targetPort: http
      protocol: TCP
